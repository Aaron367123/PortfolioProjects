name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------- Linux: system gcc + make ----------------
      - name: Build (warnings are errors)
        if: runner.os == 'Linux'
        run: make WERROR=1

      - name: Unit tests
        if: runner.os == 'Linux'
        run: make test

      - name: Integration tests
        if: runner.os == 'Linux'
        run: make integration PYTHON=python

      - name: ASan + UBSan build and tests
        if: runner.os == 'Linux'
        run: |
          # Newer runner kernels use 32 bits of mmap randomisation, which older
          # ASan runtimes cannot handle; 28 bits is the traditional default.
          sudo sysctl -w vm.mmap_rnd_bits=28
          make test-asan WERROR=1 PYTHON=python

      - name: cppcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          make cppcheck

      # ---------------- Windows: MSYS2 UCRT64 MinGW-w64 gcc ----------------
      - name: Set up MSYS2 (UCRT64 gcc + make)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Build and unit-test (warnings are errors)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mingw32-make WERROR=1
          mingw32-make test

      # The binaries are linked with -static, so they run outside MSYS2 too.
      - name: Integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -E -P tests/integration.py --server build/server.exe
