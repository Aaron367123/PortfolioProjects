<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · Myousik</title>
  <meta name="description" content="Search, sort and manage the Myousik song library.">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/pages/library.js"></script>
</head>
<body data-page="library">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <h1>Library</h1>
        <p>Every song on Myousik. Search, sort, press play — and when you're logged in, add your own.</p>
      </div>
    </section>

    <div class="container page-body">
      <form class="toolbar" id="filters" role="search" aria-label="Filter songs">
        <div class="field search">
          <label for="q" class="visually-hidden">Search songs</label>
          <span aria-hidden="true" id="search-icon"></span>
          <input type="search" id="q" name="q" placeholder="Search title, artist, album or genre" maxlength="100" autocomplete="off">
        </div>
        <div class="field">
          <label for="genre" class="visually-hidden">Genre</label>
          <select id="genre" name="genre">
            <option value="">All genres</option>
          </select>
        </div>
        <div class="field">
          <label for="sort" class="visually-hidden">Sort by</label>
          <select id="sort" name="sort">
            <option value="title:asc">Title A–Z</option>
            <option value="artist:asc">Artist A–Z</option>
            <option value="popularity:desc">Most playlisted</option>
            <option value="year:desc">Newest year</option>
            <option value="year:asc">Oldest year</option>
            <option value="duration_sec:asc">Shortest</option>
            <option value="duration_sec:desc">Longest</option>
            <option value="created_at:desc">Recently added</option>
          </select>
        </div>
        <div id="add-slot"></div>
      </form>

      <p class="status-line" id="status" role="status" aria-live="polite"></p>

      <div class="table-wrap">
        <table class="song-table">
          <caption class="visually-hidden">Songs</caption>
          <thead>
            <tr>
              <th scope="col" class="num">#</th>
              <th scope="col">Title</th>
              <th scope="col" class="col-album">Album</th>
              <th scope="col" class="col-genre">Genre</th>
              <th scope="col" class="col-year">Year</th>
              <th scope="col" class="col-length">Length</th>
              <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="song-rows"></tbody>
        </table>
      </div>

      <nav class="pagination" aria-label="Pagination">
        <button type="button" class="btn btn-ghost btn-sm" id="prev">← Previous</button>
        <span class="status-line" id="page-info"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="next">Next →</button>
      </nav>
    </div>

    <!-- Add / edit song -->
    <dialog class="modal" id="song-dialog" aria-labelledby="song-dialog-title">
      <form class="modal-inner form-grid" id="song-form" method="dialog" novalidate>
        <div class="modal-head">
          <h2 id="song-dialog-title">Add a song</h2>
          <button type="button" class="icon-btn" data-close aria-label="Close"></button>
        </div>
        <div class="form-alert" role="alert"></div>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" maxlength="120" required aria-describedby="title-error">
          <p class="field-error" id="title-error"></p>
        </div>
        <div class="field">
          <label for="artist">Artist</label>
          <input type="text" id="artist" name="artist" maxlength="120" required aria-describedby="artist-error">
          <p class="field-error" id="artist-error"></p>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="album">Album <span class="optional">(optional)</span></label>
            <input type="text" id="album" name="album" maxlength="120" aria-describedby="album-error">
            <p class="field-error" id="album-error"></p>
          </div>
          <div class="field">
            <label for="genre-input">Genre <span class="optional">(optional)</span></label>
            <input type="text" id="genre-input" name="genre" maxlength="40" list="genre-list" aria-describedby="genre-error">
            <datalist id="genre-list"></datalist>
            <p class="field-error" id="genre-error"></p>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="duration_sec">Length in seconds</label>
            <input type="number" id="duration_sec" name="duration_sec" min="1" max="3600" inputmode="numeric" required aria-describedby="duration_sec-error">
            <p class="field-error" id="duration_sec-error"></p>
          </div>
          <div class="field">
            <label for="year">Year <span class="optional">(optional)</span></label>
            <input type="number" id="year" name="year" min="1900" inputmode="numeric" aria-describedby="year-error">
            <p class="field-error" id="year-error"></p>
          </div>
        </div>
        <div class="field">
          <label for="cover_url">Cover image URL <span class="optional">(optional)</span></label>
          <input type="url" id="cover_url" name="cover_url" placeholder="https://… or /images/covers/cassette.jpg" aria-describedby="cover_url-error">
          <p class="field-error" id="cover_url-error"></p>
        </div>
        <div class="field">
          <label for="audio_url">Audio URL <span class="optional">(optional)</span></label>
          <input type="url" id="audio_url" name="audio_url" placeholder="https://…/track.mp3" aria-describedby="audio_url-error">
          <p class="field-error" id="audio_url-error"></p>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary" id="song-submit">Save song</button>
        </div>
      </form>
    </dialog>

    <!-- Delete confirmation -->
    <dialog class="modal" id="delete-dialog" aria-labelledby="delete-title">
      <form class="modal-inner" method="dialog">
        <h2 id="delete-title">Delete this song?</h2>
        <p id="delete-text" class="muted"></p>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-danger" id="delete-confirm">Delete</button>
        </div>
      </form>
    </dialog>

    <!-- Add to playlist -->
    <dialog class="modal" id="playlist-dialog" aria-labelledby="playlist-dialog-title">
      <div class="modal-inner">
        <div class="modal-head">
          <div>
            <h2 id="playlist-dialog-title">Add to playlist</h2>
            <p class="muted small" id="playlist-dialog-song"></p>
          </div>
          <button type="button" class="icon-btn" data-close aria-label="Close"></button>
        </div>
        <ul class="picker-list" id="playlist-options"></ul>
        <a class="link-arrow small" href="/playlists">Create a new playlist →</a>
      </div>
    </dialog>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
