<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Myousik</title>
  <meta name="description" content="Log in to Myousik or create an account.">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body data-page="login">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="card-page">
    <div class="form-card">
      <div class="tabs" role="tablist" aria-label="Account">
        <button type="button" role="tab" id="tab-login" aria-controls="login-form" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tab-register" aria-controls="register-form" aria-selected="false" tabindex="-1">Create account</button>
      </div>

      <form id="login-form" class="form-grid" role="tabpanel" aria-labelledby="tab-login" data-prefix="login-" novalidate>
        <h1>Welcome back</h1>
        <div class="form-alert" role="alert"></div>
        <div class="field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required aria-describedby="login-username-error">
          <p class="field-error" id="login-username-error"></p>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required aria-describedby="login-password-error">
          <p class="field-error" id="login-password-error"></p>
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <form id="register-form" class="form-grid" role="tabpanel" aria-labelledby="tab-register" data-prefix="reg-" novalidate hidden>
        <h1>Join Myousik</h1>
        <div class="form-alert" role="alert"></div>
        <div class="field">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" name="username" autocomplete="username" maxlength="24" required aria-describedby="reg-username-hint reg-username-error">
          <p class="hint" id="reg-username-hint">3–24 characters, starting with a letter. Letters, numbers and underscores only.</p>
          <p class="field-error" id="reg-username-error"></p>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" autocomplete="new-password" maxlength="128" required aria-describedby="reg-password-hint reg-password-error">
          <p class="hint" id="reg-password-hint">At least 8 characters, including a letter and a number.</p>
          <p class="field-error" id="reg-password-error"></p>
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
